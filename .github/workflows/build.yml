name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1
      - name: Write project
        run: |
          mkdir -p app/src/main/java/ru/lessons app/src/main/res/layout app/src/main/res/xml app/src/main/res/drawable
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Raspisanie"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.5.2" apply false }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "ru.lessons"
            compileSdk = 34
            defaultConfig { applicationId = "ru.lessons"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Расписание" android:icon="@android:drawable/ic_menu_my_calendar" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <receiver android:name=".Widget" android:exported="true">
                <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/info"/>
              </receiver>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/info.xml <<'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:targetCellWidth="4" android:targetCellHeight="2" android:minWidth="180dp" android:minHeight="110dp" android:minResizeWidth="110dp" android:minResizeHeight="110dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          EOF
          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="8dp" android:background="@drawable/bg">
            <LinearLayout android:id="@+id/nowBox" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="vertical" android:gravity="center_vertical" android:layout_marginTop="0dp" android:background="@drawable/card">
              <TextView android:id="@+id/nl" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingLeft="12dp" android:paddingRight="12dp" android:textSize="12sp" android:maxLines="1" android:ellipsize="end" android:textColor="#9A9AA0"/>
              <TextView android:id="@+id/ns" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingLeft="12dp" android:paddingRight="12dp" android:textSize="17sp" android:textStyle="bold" android:maxLines="1" android:ellipsize="end" android:textColor="#FFFFFF"/>
            </LinearLayout>
            <LinearLayout android:id="@+id/xBox" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:orientation="vertical" android:gravity="center_vertical" android:layout_marginTop="6dp" android:background="@drawable/card">
              <TextView android:id="@+id/xl" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingLeft="12dp" android:paddingRight="12dp" android:textSize="12sp" android:maxLines="1" android:ellipsize="end" android:textColor="#9A9AA0"/>
              <TextView android:id="@+id/xs" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingLeft="12dp" android:paddingRight="12dp" android:textSize="17sp" android:textStyle="bold" android:maxLines="1" android:ellipsize="end" android:textColor="#FFFFFF"/>
            </LinearLayout>
          </LinearLayout>
          EOF
          cat > app/src/main/res/drawable/bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FF000000"/><corners android:radius="24dp"/></shape>
          EOF
          cat > app/src/main/res/drawable/card.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FF1C1C1E"/><corners android:radius="16dp"/></shape>
          EOF
          cat > app/src/main/res/drawable/hl.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FFFFD43B"/><corners android:radius="16dp"/></shape>
          EOF
          cat > app/src/main/res/drawable/dim.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#FF151517"/><corners android:radius="16dp"/></shape>
          EOF
          cat > app/src/main/java/ru/lessons/Widget.java <<'EOF'
          package ru.lessons;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Typeface;
          import android.text.SpannableStringBuilder;
          import android.text.Spanned;
          import android.text.TextUtils;
          import android.text.style.BackgroundColorSpan;
          import android.text.style.StyleSpan;
          import android.view.View;
          import android.widget.RemoteViews;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;
          public class Widget extends AppWidgetProvider {
            static final String[] DAYS = {"Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"};
            static final String[] SH = {"Пн","Вт","Ср","Чт","Пт","Сб","Вс"};
            // урок: {день 0-6, начало, конец, предмет, кабинет, что задали}
            static List<String[]> load(Context c) {
              List<String[]> r = new ArrayList<>();
              String s = c.getSharedPreferences("s", 0).getString("d", "");
              for (String line : s.split("\n")) {
                String[] p = line.split("\\|", -1);
                if (p.length == 5) p = new String[]{p[0], p[1], p[2], p[3], p[4], ""};
                if (p.length == 6) r.add(p);
              }
              Collections.sort(r, (a, b) -> a[0].equals(b[0]) ? a[1].compareTo(b[1]) : a[0].compareTo(b[0]));
              return r;
            }
            static void save(Context c, List<String[]> l) {
              StringBuilder sb = new StringBuilder();
              for (String[] p : l) sb.append(TextUtils.join("|", p)).append("\n");
              c.getSharedPreferences("s", 0).edit().putString("d", sb.toString()).apply();
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              new Widget().onUpdate(c, m, m.getAppWidgetIds(new ComponentName(c, Widget.class)));
            }
            static int today() { return (Calendar.getInstance().get(Calendar.DAY_OF_WEEK) + 5) % 7; }
            static int mm(String t) { return Integer.parseInt(t.substring(0, 2)) * 60 + Integer.parseInt(t.substring(3, 5)); }
            static String dur(int t) { return t >= 60 ? (t / 60) + " ч" + (t % 60 == 0 ? "" : " " + (t % 60) + " мин") : t + " мин"; }
            static void row(RemoteViews v, int box, int l, int t, String label, String[] p, String when, boolean hl) {
              String room = p[4].isEmpty() ? "" : "  каб. " + p[4];
              v.setTextViewText(l, label + "  " + when + p[1] + "–" + p[2] + room);
              v.setTextViewText(t, p[3]);
              v.setInt(box, "setBackgroundResource", hl ? R.drawable.hl : R.drawable.dim);
              v.setTextColor(l, hl ? 0xFF000000 : 0xFF6C6C72);
              v.setTextColor(t, hl ? 0xFF000000 : 0xFFA9A9AF);
            }
            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              Calendar n = Calendar.getInstance();
              String now = String.format(Locale.US, "%02d:%02d", n.get(Calendar.HOUR_OF_DAY), n.get(Calendar.MINUTE));
              int d = today();
              List<String[]> all = load(c);
              String[] cur = null, nxt = null;
              int nd = 0;
              for (String[] p : all)
                if (p[0].equals(String.valueOf(d)) && p[1].compareTo(now) <= 0 && now.compareTo(p[2]) < 0) cur = p;
              String pe = null;
              for (String[] p : all)
                if (p[0].equals(String.valueOf(d)) && p[2].compareTo(now) <= 0 && (pe == null || p[2].compareTo(pe) > 0)) pe = p[2];
              for (int k = 0; k < 8 && nxt == null; k++) {
                String ds = String.valueOf((d + k) % 7);
                for (String[] p : all) {
                  if (!p[0].equals(ds) || (k == 0 && p[1].compareTo(now) <= 0)) continue;
                  nxt = p;
                  nd = k;
                  break;
                }
              }
              PendingIntent pi = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              for (int id : ids) {
                RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
                if (all.isEmpty()) {
                  v.setTextViewText(R.id.nl, "Расписание пусто");
                  v.setTextViewText(R.id.ns, "Добавь уроки в приложении");
                  v.setInt(R.id.nowBox, "setBackgroundResource", R.drawable.card);
                  v.setTextColor(R.id.nl, 0xFF9A9AA0);
                  v.setTextColor(R.id.ns, 0xFFFFFFFF);
                  v.setViewVisibility(R.id.xBox, View.GONE);
                } else {
                  v.setViewVisibility(R.id.xBox, View.VISIBLE);
                  if (cur != null) {
                    row(v, R.id.nowBox, R.id.nl, R.id.ns, "Сейчас", cur, "", true);
                  } else if (pe != null && nxt != null && nd == 0) {
                    v.setTextViewText(R.id.nl, "Перемена  " + pe + "–" + nxt[1]);
                    v.setTextViewText(R.id.ns, dur(mm(nxt[1]) - mm(pe)));
                    v.setInt(R.id.nowBox, "setBackgroundResource", R.drawable.card);
                    v.setTextColor(R.id.nl, 0xFF9A9AA0);
                    v.setTextColor(R.id.ns, 0xFFFFFFFF);
                  } else {
                    v.setTextViewText(R.id.nl, "Сейчас");
                    v.setTextViewText(R.id.ns, "Нет урока");
                    v.setInt(R.id.nowBox, "setBackgroundResource", R.drawable.card);
                    v.setTextColor(R.id.nl, 0xFF9A9AA0);
                    v.setTextColor(R.id.ns, 0xFF8A8A90);
                  }
                  if (nxt != null) {
                    String w = nd == 0 ? "" : nd == 1 ? "завтра " : SH[Integer.parseInt(nxt[0])] + " ";
                    row(v, R.id.xBox, R.id.xl, R.id.xs, "Дальше", nxt, w, false);
                  }
                }
                v.setOnClickPendingIntent(R.id.root, pi);
                m.updateAppWidget(id, v);
              }
              if (ids.length > 0) again(c, all, d, now, ids);
            }
            // следующее обновление: ближайшее начало или конец урока (иначе полночь)
            static void again(Context c, List<String[]> all, int d, String now, int[] ids) {
              String best = null;
              for (String[] p : all) {
                if (!p[0].equals(String.valueOf(d))) continue;
                for (String tm : new String[]{p[1], p[2]})
                  if (tm.compareTo(now) > 0 && (best == null || tm.compareTo(best) < 0)) best = tm;
              }
              Calendar at = Calendar.getInstance();
              if (best != null) {
                at.set(Calendar.HOUR_OF_DAY, Integer.parseInt(best.substring(0, 2)));
                at.set(Calendar.MINUTE, Integer.parseInt(best.substring(3, 5)));
              } else {
                at.add(Calendar.DAY_OF_YEAR, 1);
                at.set(Calendar.HOUR_OF_DAY, 0);
                at.set(Calendar.MINUTE, 1);
              }
              at.set(Calendar.SECOND, 5);
              Intent i = new Intent(c, Widget.class).setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE).putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids);
              PendingIntent pi = PendingIntent.getBroadcast(c, 1, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              ((AlarmManager) c.getSystemService(Context.ALARM_SERVICE)).set(AlarmManager.RTC, at.getTimeInMillis(), pi);
            }
            @Override
            public void onDisabled(Context c) {
              Intent i = new Intent(c, Widget.class).setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE);
              ((AlarmManager) c.getSystemService(Context.ALARM_SERVICE)).cancel(PendingIntent.getBroadcast(c, 1, i, PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT));
            }
          }
          EOF
          cat > app/src/main/java/ru/lessons/MainActivity.java <<'EOF'
          package ru.lessons;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.Context;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RadialGradient;
          import android.graphics.Shader;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.text.SimpleDateFormat;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.Random;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class MainActivity extends Activity {
            static final int YEL = 0xFFFFD43B, CARD = 0xFF17171A, GREY = 0xFF9A9AA0;
            static final String[] KEY = {"матем|алгебр|геометр","русск|письм","литер|чтени","англ|немец|франц|язык","физик","хим","биол|окруж","истор","геогр","информ","физкульт|физ-ра|физра","музык","изо|рисов|худож","технолог|труд","общест|прав","астроном|космос"};
            static final String[] EMO = {"📐","✏️","📚","🌍","⚡","🧪","🧬","🏛️","🗺️","💻","⚽","🎵","🎨","🔧","⚖️","🔭"};
            static final String[] PH = {"Ты справишься 💪","Мозг на максимуме 🧠","Почти дошли 🚀","Держим темп 🔥"};
            static final String[] JOKES = {"Учиться — это круто 😎","Ты красавчик 💛","Пять по всем предметам! ⭐","Перемена — святое дело ☕","Главное — не забыть тетрадь 📓"};
            int sel;
            LinearLayout tabs, list, hero;
            TextView greet, title;
            Handler hd = new Handler(Looper.getMainLooper());
            Runnable tick = new Runnable() {
              @Override
              public void run() { heroDraw(); hd.postDelayed(this, 30000); }
            };
            // мягкое свечение на фоне
            static class Glow extends View {
              Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
              Glow(Context c) { super(c); }
              void blob(Canvas cv, float x, float y, float r, int col) {
                p.setShader(new RadialGradient(x, y, r, col, col & 0x00FFFFFF, Shader.TileMode.CLAMP));
                cv.drawCircle(x, y, r, p);
              }
              @Override
              protected void onDraw(Canvas cv) {
                cv.drawColor(0xFF050507);
                int w = getWidth(), h = getHeight();
                blob(cv, w * 0.95f, h * 0.04f, w * 0.9f, 0x55FFD43B);
                blob(cv, 0f, h * 0.92f, w * 0.9f, 0x447B5CFF);
              }
            }
            int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }
            GradientDrawable rr(int color, int r) {
              GradientDrawable g = new GradientDrawable();
              g.setColor(color);
              g.setCornerRadius(dp(r));
              return g;
            }
            TextView tv(String t, int sp, int color, boolean bold) {
              TextView v = new TextView(this);
              v.setText(t);
              v.setTextSize(sp);
              v.setTextColor(color);
              if (bold) v.setTypeface(Typeface.DEFAULT_BOLD);
              return v;
            }
            LinearLayout.LayoutParams lp(int l, int t, int r, int b) {
              LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(-1, -2);
              p.setMargins(dp(l), dp(t), dp(r), dp(b));
              return p;
            }
            static String cap(String s) { return s.isEmpty() ? s : s.substring(0, 1).toUpperCase() + s.substring(1); }
            static String emo(String n) {
              n = n.toLowerCase();
              for (int i = 0; i < KEY.length; i++)
                for (String k : KEY[i].split("\\|")) if (n.contains(k)) return EMO[i];
              return "📘";
            }
            View bar(float f, int track, int fill) {
              LinearLayout b = new LinearLayout(this);
              b.setBackground(rr(track, 4));
              float c = Math.max(0.03f, Math.min(1f, f));
              View a = new View(this);
              a.setBackground(rr(fill, 4));
              b.addView(a, new LinearLayout.LayoutParams(0, dp(8), c));
              b.addView(new View(this), new LinearLayout.LayoutParams(0, dp(8), 1f - c));
              return b;
            }
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setStatusBarColor(0xFF050507);
              getWindow().setNavigationBarColor(0xFF050507);
              sel = Widget.today();
              FrameLayout root = new FrameLayout(this);
              root.addView(new Glow(this), new FrameLayout.LayoutParams(-1, -1));
              ScrollView sv = new ScrollView(this);
              sv.setVerticalScrollBarEnabled(false);
              LinearLayout col = new LinearLayout(this);
              col.setOrientation(LinearLayout.VERTICAL);
              col.setPadding(dp(18), dp(20), dp(18), dp(110));
              greet = tv("", 14, GREY, false);
              title = tv("", 30, 0xFFFFFFFF, true);
              title.setOnClickListener(v -> Toast.makeText(this, JOKES[new Random().nextInt(JOKES.length)], Toast.LENGTH_SHORT).show());
              hero = new LinearLayout(this);
              hero.setOrientation(LinearLayout.VERTICAL);
              tabs = new LinearLayout(this);
              list = new LinearLayout(this);
              list.setOrientation(LinearLayout.VERTICAL);
              col.addView(greet);
              col.addView(title);
              col.addView(hero, lp(0, 18, 0, 14));
              col.addView(tabs, lp(0, 0, 0, 14));
              col.addView(list);
              sv.addView(col);
              root.addView(sv, new FrameLayout.LayoutParams(-1, -1));
              TextView fab = tv("+", 32, 0xFF000000, true);
              fab.setGravity(Gravity.CENTER);
              fab.setBackground(rr(YEL, 30));
              fab.setElevation(dp(8));
              fab.setOnClickListener(v -> edit(null));
              FrameLayout.LayoutParams fp = new FrameLayout.LayoutParams(dp(60), dp(60), Gravity.BOTTOM | Gravity.END);
              fp.setMargins(0, 0, dp(20), dp(24));
              root.addView(fab, fp);
              setContentView(root);
            }
            @Override
            protected void onResume() {
              super.onResume();
              draw();
              hd.removeCallbacks(tick);
              hd.postDelayed(tick, 30000);
            }
            @Override
            protected void onPause() {
              super.onPause();
              hd.removeCallbacks(tick);
            }
            void card(boolean hl, String label, String big, String sub, String foot, float prog) {
              int fg = hl ? 0xFF000000 : 0xFFFFFFFF, dim = hl ? 0xB3000000 : GREY;
              LinearLayout c = new LinearLayout(this);
              c.setOrientation(LinearLayout.VERTICAL);
              c.setPadding(dp(20), dp(18), dp(20), dp(18));
              GradientDrawable g = hl ? new GradientDrawable(GradientDrawable.Orientation.TL_BR, new int[]{0xFFFFE066, 0xFFFFB300}) : rr(CARD, 28);
              g.setCornerRadius(dp(28));
              if (!hl) g.setStroke(dp(1), 0x55FFD43B);
              c.setBackground(g);
              c.addView(tv(label, 13, dim, false));
              TextView b = tv(big, 26, fg, true);
              b.setPadding(0, dp(6), 0, dp(2));
              c.addView(b);
              if (!sub.isEmpty()) c.addView(tv(sub, 15, dim, false));
              if (prog >= 0) c.addView(bar(prog, hl ? 0x33000000 : 0xFF2A2A30, hl ? 0xFF000000 : YEL), lp(0, 14, 0, 0));
              if (!foot.isEmpty()) {
                TextView f = tv(foot, 13, dim, false);
                f.setPadding(0, dp(12), 0, 0);
                c.addView(f);
              }
              hero.addView(c, new LinearLayout.LayoutParams(-1, -2));
            }
            void heroDraw() {
              hero.removeAllViews();
              Calendar n = Calendar.getInstance();
              int now = n.get(Calendar.HOUR_OF_DAY) * 60 + n.get(Calendar.MINUTE), d = Widget.today(), pe = -1, nd = 0;
              String[] cur = null, nxt = null;
              List<String[]> all = Widget.load(this);
              boolean any = false;
              for (String[] p : all) {
                if (!p[0].equals(String.valueOf(d))) continue;
                any = true;
                int s0 = Widget.mm(p[1]), e0 = Widget.mm(p[2]);
                if (s0 <= now && now < e0) cur = p;
                if (e0 <= now) pe = Math.max(pe, e0);
              }
              for (int k = 0; k < 8 && nxt == null; k++) {
                String ds = String.valueOf((d + k) % 7);
                for (String[] p : all) {
                  if (!p[0].equals(ds) || (k == 0 && Widget.mm(p[1]) <= now)) continue;
                  nxt = p;
                  nd = k;
                  break;
                }
              }
              String wh = nd == 0 ? "" : nd == 1 ? "завтра " : (nxt == null ? "" : Widget.SH[Integer.parseInt(nxt[0])] + " ");
              String tail = nxt == null ? "" : "Дальше: " + emo(nxt[3]) + " " + nxt[3] + ", " + wh + nxt[1];
              String ph = PH[(int) ((System.currentTimeMillis() / 1800000L) % PH.length)];
              if (cur != null) {
                int s0 = Widget.mm(cur[1]), e0 = Widget.mm(cur[2]);
                card(true, "Идёт урок, осталось " + Widget.dur(e0 - now), emo(cur[3]) + " " + cur[3],
                    cur[1] + " – " + cur[2] + (cur[4].isEmpty() ? "" : "  каб. " + cur[4]),
                    ph + (tail.isEmpty() ? "" : "\n" + tail), (now - s0) / (float) (e0 - s0));
              } else if (pe >= 0 && nxt != null && nd == 0) {
                int ns = Widget.mm(nxt[1]);
                card(false, "Перемена ☕  осталось " + Widget.dur(ns - now), "Отдохни немного", tail, "", (now - pe) / (float) (ns - pe));
              } else if (nxt != null) {
                card(false, nd == 0 ? "Скоро начнём 🚀" : any ? "На сегодня всё 🎉" : "Сегодня уроков нет 🌴",
                    emo(nxt[3]) + " " + nxt[3], wh + nxt[1] + " – " + nxt[2] + (nxt[4].isEmpty() ? "" : "  каб. " + nxt[4]), "", -1f);
              } else {
                card(false, "Расписание пусто", "🌴 Пока пусто", "Нажми «+», чтобы добавить урок", "", -1f);
              }
            }
            void draw() {
              Calendar n = Calendar.getInstance();
              int h = n.get(Calendar.HOUR_OF_DAY), now = h * 60 + n.get(Calendar.MINUTE), td = Widget.today();
              greet.setText(h < 5 ? "Доброй ночи 🌙" : h < 12 ? "Доброе утро ☀️" : h < 18 ? "Добрый день 🌤️" : "Добрый вечер 🌙");
              title.setText(cap(new SimpleDateFormat("EEEE, d MMMM", new Locale("ru")).format(new Date())));
              heroDraw();
              tabs.removeAllViews();
              String[] sh = {"Пн","Вт","Ср","Чт","Пт","Сб","Вс"};
              for (int i = 0; i < 7; i++) {
                final int d = i;
                TextView t = tv(sh[i], 14, i == sel ? 0xFF000000 : i == td ? 0xFFFFFFFF : GREY, i == sel);
                t.setGravity(Gravity.CENTER);
                t.setPadding(0, dp(10), 0, dp(10));
                GradientDrawable g = rr(i == sel ? YEL : CARD, 14);
                if (i == td && i != sel) g.setStroke(dp(1), YEL);
                t.setBackground(g);
                t.setOnClickListener(v -> { sel = d; draw(); });
                LinearLayout.LayoutParams tp = new LinearLayout.LayoutParams(0, -2, 1f);
                tp.setMargins(dp(3), 0, dp(3), 0);
                tabs.addView(t, tp);
              }
              list.removeAllViews();
              int k = 0;
              for (String[] p : Widget.load(this)) {
                if (!p[0].equals(String.valueOf(sel))) continue;
                int s0 = Widget.mm(p[1]), e0 = Widget.mm(p[2]);
                boolean cu = sel == td && s0 <= now && now < e0, past = sel == td && e0 <= now;
                LinearLayout r = new LinearLayout(this);
                r.setGravity(Gravity.CENTER_VERTICAL);
                r.setPadding(dp(14), dp(14), dp(14), dp(14));
                GradientDrawable g = rr(cu ? 0xFF2A2410 : CARD, 20);
                if (cu) g.setStroke(dp(2), YEL);
                r.setBackground(g);
                LinearLayout tm = new LinearLayout(this);
                tm.setOrientation(LinearLayout.VERTICAL);
                tm.addView(tv(p[1], 17, 0xFFFFFFFF, true));
                tm.addView(tv(p[2], 13, GREY, false));
                r.addView(tm, new LinearLayout.LayoutParams(dp(56), -2));
                TextView em = tv(emo(p[3]), 22, 0xFFFFFFFF, false);
                em.setGravity(Gravity.CENTER);
                em.setBackground(rr(0xFF26262B, 22));
                LinearLayout.LayoutParams ep = new LinearLayout.LayoutParams(dp(44), dp(44));
                ep.setMargins(dp(4), 0, dp(12), 0);
                r.addView(em, ep);
                LinearLayout x = new LinearLayout(this);
                x.setOrientation(LinearLayout.VERTICAL);
                x.addView(tv(p[3], 17, 0xFFFFFFFF, true));
                if (!p[4].isEmpty()) x.addView(tv("каб. " + p[4], 13, GREY, false));
                if (!p[5].isEmpty()) x.addView(tv("📝 " + p[5], 13, 0xFFE6C84A, false));
                r.addView(x, new LinearLayout.LayoutParams(0, -2, 1f));
                r.setOnClickListener(v -> edit(p));
                list.addView(r, lp(0, 0, 0, 10));
                r.setAlpha(0f);
                r.setTranslationY(dp(24));
                r.animate().alpha(past ? 0.45f : 1f).translationY(0f).setStartDelay(k++ * 50L).setDuration(260).start();
              }
              if (k == 0) {
                TextView e = tv("🌴\nУроков нет, отдыхай!", 16, GREY, false);
                e.setGravity(Gravity.CENTER);
                e.setPadding(0, dp(40), 0, 0);
                list.addView(e);
              }
            }
            EditText field(LinearLayout p, String hint, String v, int type) {
              EditText t = new EditText(this);
              
              t.setInputType(type);
              t.setHint(hint);
              t.setText(v);
              p.addView(t);
              return t;
            }
            static String fix(String s) {
              Matcher m = Pattern.compile("^\\s*(\\d{1,2})[:.](\\d{2})\\s*$").matcher(s);
              if (!m.matches()) return null;
              int h = Integer.parseInt(m.group(1)), mi = Integer.parseInt(m.group(2));
              return (h > 23 || mi > 59) ? null : String.format(Locale.US, "%02d:%02d", h, mi);
            }
            static String clean(String s) { return s.trim().replace("|", " ").replace("\n", " "); }
            void edit(String[] x) {
              LinearLayout f = new LinearLayout(this);
              f.setOrientation(LinearLayout.VERTICAL);
              f.setPadding(48, 16, 48, 0);
              EditText n = field(f, "Предмет", x == null ? "" : x[3], InputType.TYPE_CLASS_TEXT);
              EditText s = field(f, "Начало, например 08:30", x == null ? "08:30" : x[1], InputType.TYPE_CLASS_DATETIME);
              EditText e = field(f, "Конец, например 09:15", x == null ? "09:15" : x[2], InputType.TYPE_CLASS_DATETIME);
              EditText r = field(f, "Кабинет", x == null ? "" : x[4], InputType.TYPE_CLASS_TEXT);
              EditText hw = field(f, "Что задали (необязательно)", x == null ? "" : x[5], InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_FLAG_MULTI_LINE | InputType.TYPE_TEXT_FLAG_CAP_SENTENCES);
              ScrollView sc = new ScrollView(this);
              sc.addView(f);
              AlertDialog.Builder a = new AlertDialog.Builder(this).setTitle(x == null ? "Новый урок" : "Изменить урок").setView(sc);
              a.setPositiveButton("Сохранить", (dlg, w) -> {
                String name = clean(n.getText().toString());
                String st = fix(s.getText().toString());
                String en = fix(e.getText().toString());
                if (name.isEmpty() || st == null || en == null) {
                  Toast.makeText(this, "Проверьте название и время (например 08:30)", Toast.LENGTH_LONG).show();
                  return;
                }
                List<String[]> l = Widget.load(this);
                if (x != null) l.removeIf(q -> Arrays.equals(q, x));
                l.add(new String[]{x == null ? String.valueOf(sel) : x[0], st, en, name, clean(r.getText().toString()), clean(hw.getText().toString())});
                Widget.save(this, l);
                draw();
              });
              if (x != null) a.setNeutralButton("Удалить", (dlg, w) -> {
                List<String[]> l = Widget.load(this);
                l.removeIf(q -> Arrays.equals(q, x));
                Widget.save(this, l);
                draw();
              });
              a.setNegativeButton("Отмена", null);
              a.show();
            }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Расписание v${{ github.run_number }}" --notes "Скачай app-debug.apk и установи" 
