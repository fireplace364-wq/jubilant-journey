name: Build APK
on:
  push:
    branches: ["**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Write project
        run: |
          mkdir -p app/src/main/java/ru/lessons app/src/main/res/layout app/src/main/res/xml app/src/main/res/drawable
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Raspisanie"
          include(":app")
          EOF
          cat > build.gradle.kts <<'EOF'
          plugins { id("com.android.application") version "8.5.2" apply false }
          EOF
          cat > app/build.gradle.kts <<'EOF'
          plugins { id("com.android.application") }
          android {
            namespace = "ru.lessons"
            compileSdk = 34
            defaultConfig { applicationId = "ru.lessons"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = "1.0" }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Расписание" android:icon="@android:drawable/ic_menu_my_calendar" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <receiver android:name=".Widget" android:exported="true">
                <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/info"/>
              </receiver>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/xml/info.xml <<'EOF'
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" android:minWidth="250dp" android:minHeight="110dp" android:updatePeriodMillis="1800000" android:initialLayout="@layout/widget" android:resizeMode="horizontal|vertical" android:widgetCategory="home_screen"/>
          EOF
          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/root" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="14dp" android:background="@drawable/bg">
            <TextView android:id="@+id/h" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#14213D" android:textSize="16sp" android:textStyle="bold"/>
            <TextView android:id="@+id/b" android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="4dp" android:textColor="#14213D" android:textSize="14sp" android:maxLines="8" android:ellipsize="end"/>
          </LinearLayout>
          EOF
          cat > app/src/main/res/drawable/bg.xml <<'EOF'
          <shape xmlns:android="http://schemas.android.com/apk/res/android"><solid android:color="#F2FFFFFF"/><corners android:radius="22dp"/></shape>
          EOF
          cat > app/src/main/java/ru/lessons/Widget.java <<'EOF'
          package ru.lessons;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.graphics.Typeface;
          import android.text.SpannableStringBuilder;
          import android.text.Spanned;
          import android.text.TextUtils;
          import android.text.style.BackgroundColorSpan;
          import android.text.style.StyleSpan;
          import android.widget.RemoteViews;
          import java.util.ArrayList;
          import java.util.Calendar;
          import java.util.Collections;
          import java.util.List;
          import java.util.Locale;
          public class Widget extends AppWidgetProvider {
            static final String[] DAYS = {"Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"};
            // урок: {день 0-6, начало, конец, предмет, кабинет}
            static List<String[]> load(Context c) {
              List<String[]> r = new ArrayList<>();
              String s = c.getSharedPreferences("s", 0).getString("d", "");
              for (String line : s.split("\n")) {
                String[] p = line.split("\\|", -1);
                if (p.length == 5) r.add(p);
              }
              Collections.sort(r, (a, b) -> a[0].equals(b[0]) ? a[1].compareTo(b[1]) : a[0].compareTo(b[0]));
              return r;
            }
            static void save(Context c, List<String[]> l) {
              StringBuilder sb = new StringBuilder();
              for (String[] p : l) sb.append(TextUtils.join("|", p)).append("\n");
              c.getSharedPreferences("s", 0).edit().putString("d", sb.toString()).apply();
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              new Widget().onUpdate(c, m, m.getAppWidgetIds(new ComponentName(c, Widget.class)));
            }
            static int today() { return (Calendar.getInstance().get(Calendar.DAY_OF_WEEK) + 5) % 7; }
            @Override
            public void onUpdate(Context c, AppWidgetManager m, int[] ids) {
              Calendar n = Calendar.getInstance();
              String now = String.format(Locale.US, "%02d:%02d", n.get(Calendar.HOUR_OF_DAY), n.get(Calendar.MINUTE));
              int d = today();
              SpannableStringBuilder sb = new SpannableStringBuilder();
              for (String[] p : load(c)) {
                if (!p[0].equals(String.valueOf(d))) continue;
                int st = sb.length();
                sb.append(p[1]).append("  ").append(p[3]);
                if (!p[4].isEmpty()) sb.append(" (").append(p[4]).append(")");
                if (p[1].compareTo(now) <= 0 && now.compareTo(p[2]) < 0) {
                  sb.setSpan(new StyleSpan(Typeface.BOLD), st, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                  sb.setSpan(new BackgroundColorSpan(0xFFFFD43B), st, sb.length(), Spanned.SPAN_EXCLUSIVE_EXCLUSIVE);
                }
                sb.append("\n");
              }
              if (sb.length() == 0) sb.append("Уроков нет");
              PendingIntent pi = PendingIntent.getActivity(c, 0, new Intent(c, MainActivity.class), PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
              for (int id : ids) {
                RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
                v.setTextViewText(R.id.h, DAYS[d]);
                v.setTextViewText(R.id.b, sb);
                v.setOnClickPendingIntent(R.id.root, pi);
                m.updateAppWidget(id, v);
              }
            }
          }
          EOF
          cat > app/src/main/java/ru/lessons/MainActivity.java <<'EOF'
          package ru.lessons;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;
          import android.text.InputType;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          public class MainActivity extends Activity {
            int sel;
            LinearLayout list, tabs;
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              sel = Widget.today();
              int pd = (int) (16 * getResources().getDisplayMetrics().density);
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setPadding(pd, pd, pd, pd);
              TextView h = new TextView(this);
              h.setText("Расписание");
              h.setTextSize(28);
              h.setPadding(0, 0, 0, pd);
              root.addView(h);
              tabs = new LinearLayout(this);
              root.addView(tabs);
              ScrollView sv = new ScrollView(this);
              list = new LinearLayout(this);
              list.setOrientation(LinearLayout.VERTICAL);
              sv.addView(list);
              root.addView(sv, new LinearLayout.LayoutParams(-1, 0, 1f));
              Button add = new Button(this);
              add.setText("+ Добавить урок");
              add.setOnClickListener(v -> edit(null));
              root.addView(add);
              setContentView(root);
              draw();
            }
            void draw() {
              String[] sh = {"Пн","Вт","Ср","Чт","Пт","Сб","Вс"};
              tabs.removeAllViews();
              for (int i = 0; i < 7; i++) {
                final int d = i;
                Button t = new Button(this);
                t.setText(sh[i]);
                t.setAllCaps(false);
                t.setTextSize(13);
                t.setMinWidth(0);
                t.setMinimumWidth(0);
                t.setPadding(0, 0, 0, 0);
                t.setTextColor(0xFF14213D);
                t.setBackgroundColor(i == sel ? 0xFFFFD43B : 0xFFE9EDF2);
                t.setOnClickListener(v -> { sel = d; draw(); });
                tabs.addView(t, new LinearLayout.LayoutParams(0, -2, 1f));
              }
              list.removeAllViews();
              int n = 0;
              for (String[] p : Widget.load(this)) {
                if (!p[0].equals(String.valueOf(sel))) continue;
                n++;
                TextView t = new TextView(this);
                t.setText(p[1] + " – " + p[2] + "\n" + p[3] + (p[4].isEmpty() ? "" : "  (каб. " + p[4] + ")"));
                t.setTextSize(18);
                t.setPadding(0, 24, 0, 24);
                t.setOnClickListener(v -> edit(p));
                list.addView(t);
              }
              if (n == 0) {
                TextView e = new TextView(this);
                e.setText(Widget.DAYS[sel] + ": уроков нет");
                e.setPadding(0, 40, 0, 0);
                list.addView(e);
              }
            }
            EditText field(LinearLayout p, String hint, String v, int type) {
              EditText t = new EditText(this);
              t.setSingleLine(true);
              t.setInputType(type);
              t.setHint(hint);
              t.setText(v);
              p.addView(t);
              return t;
            }
            static String fix(String s) {
              Matcher m = Pattern.compile("^\\s*(\\d{1,2})[:.](\\d{2})\\s*$").matcher(s);
              if (!m.matches()) return null;
              int h = Integer.parseInt(m.group(1)), mi = Integer.parseInt(m.group(2));
              return (h > 23 || mi > 59) ? null : String.format(Locale.US, "%02d:%02d", h, mi);
            }
            static String clean(String s) { return s.trim().replace("|", " ").replace("\n", " "); }
            void edit(String[] x) {
              LinearLayout f = new LinearLayout(this);
              f.setOrientation(LinearLayout.VERTICAL);
              f.setPadding(48, 16, 48, 0);
              EditText n = field(f, "Предмет", x == null ? "" : x[3], InputType.TYPE_CLASS_TEXT);
              EditText s = field(f, "Начало, например 08:30", x == null ? "08:30" : x[1], InputType.TYPE_CLASS_DATETIME);
              EditText e = field(f, "Конец, например 09:15", x == null ? "09:15" : x[2], InputType.TYPE_CLASS_DATETIME);
              EditText r = field(f, "Кабинет", x == null ? "" : x[4], InputType.TYPE_CLASS_TEXT);
              AlertDialog.Builder a = new AlertDialog.Builder(this).setTitle(x == null ? "Новый урок" : "Изменить урок").setView(f);
              a.setPositiveButton("Сохранить", (dlg, w) -> {
                String name = clean(n.getText().toString());
                String st = fix(s.getText().toString());
                String en = fix(e.getText().toString());
                if (name.isEmpty() || st == null || en == null) {
                  Toast.makeText(this, "Проверьте название и время (например 08:30)", Toast.LENGTH_LONG).show();
                  return;
                }
                List<String[]> l = Widget.load(this);
                if (x != null) l.removeIf(q -> Arrays.equals(q, x));
                l.add(new String[]{x == null ? String.valueOf(sel) : x[0], st, en, name, clean(r.getText().toString())});
                Widget.save(this, l);
                draw();
              });
              if (x != null) a.setNeutralButton("Удалить", (dlg, w) -> {
                List<String[]> l = Widget.load(this);
                l.removeIf(q -> Arrays.equals(q, x));
                Widget.save(this, l);
                draw();
              });
              a.setNegativeButton("Отмена", null);
              a.show();
            }
          }
          EOF
      - name: Build
        run: gradle assembleDebug --no-daemon
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --title "Расписание v${{ github.run_number }}" --notes "Скачай app-debug.apk и установи"
