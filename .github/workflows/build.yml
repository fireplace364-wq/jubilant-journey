
name: Build Black Schedule APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/school/schedule
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BlackSchedule"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.school.schedule'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.school.schedule'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="Моё расписание"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".ScheduleWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info"/>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="180dp"
              android:minHeight="110dp"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"
              android:updatePeriodMillis="1800000"
              android:description="@string/widget_description"/>
          EOF

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="widget_description">Текущий и следующий урок</string>
          </resources>
          EOF

          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <LinearLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="12dp"
              android:background="#080808">

              <TextView
                  android:id="@+id/day"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="РАСПИСАНИЕ"
                  android:textColor="#999999"
                  android:textSize="11sp"/>

              <TextView
                  android:id="@+id/current"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Сейчас: —"
                  android:textColor="#FFFFFF"
                  android:textStyle="bold"
                  android:textSize="16sp"
                  android:maxLines="1"
                  android:ellipsize="end"
                  android:layout_marginTop="5dp"/>

              <TextView
                  android:id="@+id/next"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Далее: —"
                  android:textColor="#DDDDDD"
                  android:textSize="13sp"
                  android:maxLines="1"
                  android:ellipsize="end"
                  android:layout_marginTop="4dp"/>

              <TextView
                  android:id="@+id/break_time"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Перемена: —"
                  android:textColor="#AAAAAA"
                  android:textSize="12sp"
                  android:layout_marginTop="3dp"/>
          </LinearLayout>
          EOF

          cat > app/src/main/java/com/school/schedule/ScheduleData.java <<'EOF'
          package com.school.schedule;

          import java.util.Calendar;
          import java.util.Locale;

          public class ScheduleData {
              public static final String[][] DAYS = {
                  {"Хим/био","Нем. язык","Бел. язык","Математика","Биология","ФК","ДПЮ"},
                  {"Математика","Химия","Физика","Русский язык","История","Русский язык","Биология"},
                  {"Биол/хим","Нем. язык","Русская лит.","Математика","Химия","ФК","Информатика"},
                  {"Астрономия","Бел. язык","Обществоведение","Бел. лит.","Математика","ФК"},
                  {"Хим/био","Хим/био","ФК","География","История","Физика"}
              };

              public static final String[] NAMES = {
                  "Понедельник","Вторник","Среда","Четверг","Пятница"
              };

              public static final int[] START = new int[7];
              public static final int[] END = new int[7];
              public static final int[] BREAK = {15,10,15,15,10,10,0};

              static {
                  int t = 8 * 60 + 40;
                  for (int i=0; i<7; i++) {
                      START[i] = t;
                      END[i] = t + 45;
                      t = END[i] + BREAK[i];
                  }
              }

              public static String time(int m) {
                  return String.format(Locale.getDefault(), "%02d:%02d", m/60, m%60);
              }

              public static int today() {
                  int d = Calendar.getInstance().get(Calendar.DAY_OF_WEEK);
                  return d == Calendar.SUNDAY ? -1 : d - Calendar.MONDAY;
              }

              public static String status() {
                  Calendar c = Calendar.getInstance();
                  int now = c.get(Calendar.HOUR_OF_DAY)*60 + c.get(Calendar.MINUTE);
                  int day = today();

                  if (day < 0 || day > 4)
                      return "Сегодня уроков нет";

                  String[] subjects = DAYS[day];

                  for (int i=0; i<7; i++) {
                      if (now >= START[i] && now < END[i]) {
                          String current = i < subjects.length ? subjects[i] : "Урок";
                          String next = i+1 < subjects.length ? subjects[i+1] : null;
                          return "Сейчас: " + current + " (" +
                              time(START[i]) + "–" + time(END[i]) + ")\\n" +
                              (next == null ? "Следующий урок: нет" :
                              "Далее: " + next + " (" + time(START[i+1]) +
                              "–" + time(END[i+1]) + ")") +
                              "\\nПеремена после: " + BREAK[i] + " мин";
                      }

                      if (now >= END[i] && i < 6 && now < START[i+1]) {
                          String next = i+1 < subjects.length ? subjects[i+1] : "Урок";
                          return "Перемена: " + (START[i+1]-now) + " мин осталось\\n" +
                              "Далее: " + next + " (" + time(START[i+1]) +
                              "–" + time(END[i+1]) + ")";
                      }
                  }

                  if (now < START[0]) return "Уроки ещё не начались\\nНачало: 08:40";
                  return "Уроки на сегодня закончились";
              }
          }
          EOF

          cat > app/src/main/java/com/school/schedule/ScheduleWidget.java <<'EOF'
          package com.school.schedule;

          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.Context;
          import android.widget.RemoteViews;
          import java.util.Calendar;

          public class ScheduleWidget extends AppWidgetProvider {
              @Override
              public void onUpdate(Context context, AppWidgetManager manager, int[] ids) {
                  int d = ScheduleData.today();
                  String day = d >= 0 && d < 5
                      ? ScheduleData.NAMES[d] : "Выходной";

                  for (int id : ids) {
                      RemoteViews v = new RemoteViews(context.getPackageName(), R.layout.widget);
                      String[] lines = ScheduleData.status().split("\\n");
                      v.setTextViewText(R.id.day, day.toUpperCase());
                      v.setTextViewText(R.id.current, lines[0]);
                      v.setTextViewText(R.id.next, lines.length > 1 ? lines[1] : "");
                      v.setTextViewText(R.id.break_time,
                          lines.length > 2 ? lines[2] : "Чёрная тема");
                      manager.updateAppWidget(id, v);
                  }
              }

              @Override
              public void onReceive(Context context, android.content.Intent intent) {
                  super.onReceive(context, intent);
                  if (AppWidgetManager.ACTION_APPWIDGET_UPDATE.equals(intent.getAction())) {
                      AppWidgetManager manager = AppWidgetManager.getInstance(context);
                      onUpdate(context, manager,
                          manager.getAppWidgetIds(new android.content.ComponentName(
                              context, ScheduleWidget.class)));
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/school/schedule/MainActivity.java <<'EOF'
          package com.school.schedule;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.appwidget.AppWidgetManager;
          import android.content.ComponentName;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(24, 32, 24, 24);
                  root.setBackgroundColor(Color.rgb(8,8,8));

                  TextView title = new TextView(this);
                  title.setText("МОЁ РАСПИСАНИЕ");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(24);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title);

                  TextView info = new TextView(this);
                  info.setText(ScheduleData.status());
                  info.setTextColor(Color.WHITE);
                  info.setTextSize(18);
                  info.setPadding(0, 28, 0, 24);
                  root.addView(info);

                  int d = ScheduleData.today();
                  if (d >= 0 && d < 5) {
                      TextView list = new TextView(this);
                      StringBuilder s = new StringBuilder();
                      s.append(ScheduleData.NAMES[d]).append("\\n\\n");
                      String[] subjects = ScheduleData.DAYS[d];
                      for (int i=0; i<subjects.length; i++) {
                          s.append(i+1).append(". ").append(subjects[i])
                           .append("  ")
                           .append(ScheduleData.time(ScheduleData.START[i]))
                           .append("–")
                           .append(ScheduleData.time(ScheduleData.END[i]))
                           .append("\\n");
                      }
                      list.setText(s.toString());
                      list.setTextColor(Color.LTGRAY);
                      list.setTextSize(16);
                      root.addView(list);
                  }

                  setContentView(root);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  sendBroadcast(new android.content.Intent(this, ScheduleWidget.class)
                      .setAction(AppWidgetManager.ACTION_APPWIDGET_UPDATE));
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Black-Schedule-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
